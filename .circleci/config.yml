version: 2.1

defaults: &defaults
  working_directory: ~/grc
  docker:
    - image: cimg/node:24.21

jobs:
  build:
    <<: *defaults
    steps:
      - checkout
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }} # fallback to using the latest cache if no exact match is found
          - v1-dependencies-
      - run: npm install
      - run: npm run build
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/grc
          paths: .

  test:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grc
      - run:
          name: Run tests
          command: npm run test:prod
  
  test_smoke:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grc
      - run:
          name: Run smoke tests
          command: npm run test:smoke

  test_smoke_spend:
    <<: *defaults
    environment:
      GRC_SMOKE_SPEND: 'true'
    steps:
      - attach_workspace:
          at: ~/grc
      - run:
          name: Run spending smoke tests (testnet)
          command: npm run test:spend

  lint_commit_message:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grc
      - run:
          name: Define environment variable with lastest commit's message
          command: |
            echo 'export COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Lint commit message
          command: echo "$COMMIT_MESSAGE" | npx commitlint
  
  typecheck:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grc
      - run:
          name: "Typecheck"
          command: npm run typecheck 

  deploy-npm:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grc
      - run:
          # npm trusted publishing (OIDC): no NPM_TOKEN to rotate. npm swaps
          # NPM_ID_TOKEN for a short-lived publish token. NPM_TOKEN is unset
          # so a stale one can't take precedence.
          name: Semantic release
          command: |
            unset NPM_TOKEN
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npm run semantic-release

  deploy-docs:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/grc
      - run:
          name: Deploy docs
          command: npm run deploy:docs

workflows:
  test-deploy:
    jobs:
      - build:
          filters:
            branches:
              ignore: gh-pages
      - lint_commit_message:
          filters:
            branches:
              ignore: gh-pages
          requires:
            - build
      - typecheck:
          filters:
            branches:
              ignore: gh-pages
          requires:
            - build
      - test:
          filters:
            branches:
              ignore: gh-pages
          requires:
            - build
      # Smokes run last: only after every other check has passed
      - test_smoke:
          filters:
            branches:
              ignore: gh-pages
          requires:
            - build
            - lint_commit_message
            - test
            - typecheck
          context:
            - testnet
      # Spends real tGRC, so dev and master only, and only after the
      # read-only smokes pass
      - test_smoke_spend:
          filters:
            branches:
              only:
                - dev
                - master
          requires:
            - test_smoke
          context:
            - testnet
      - deploy-docs:
          filters:
            branches:
              only: master
              ignore: gh-pages
          requires:
            - build
            - lint_commit_message
            - test
            - test_smoke
            - test_smoke_spend
            - typecheck
          context:
            - semantic-release
      - deploy-npm:
          filters:
            branches:
              only: master
              ignore: gh-pages
          requires:
            - build
            - lint_commit_message
            - test
            - test_smoke
            - test_smoke_spend
            - typecheck
          context:
            - semantic-release
